<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7a1f3d">
<title>{% block title %}Présences{% endblock %} — UGD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="entete">
  <div class="entete-in">
    <a class="marque" href="{{ url_for('admin') if is_admin() else url_for('accueil') }}">UGD <span>Présences</span></a>
    <nav>
      {% if is_admin() %}
        <a href="{{ url_for('admin') }}">Cours</a>
        <a href="{{ url_for('admin_gymnastes') }}">Gymnastes</a>
        <a href="{{ url_for('admin_logout') }}">Quitter</a>
      {% else %}
        <a href="{{ url_for('accueil') }}">Mes cours</a>
      {% endif %}
    </nav>
  </div>
</header>
<main>
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in messages %}<div class="flash flash-{{ cat }}" role="status">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
{% block scripts %}{% endblock %}
</body>
</html>
